<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        @layer base {
            body { overscroll-behavior: none; }
            .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
            .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Desktop sidebar - hidden on mobile */
        @media (max-width: 1024px) {
            .desktop-sidebar { display: none !important; }
            .desktop-header { display: none !important; }
            .desktop-content { padding-left: 0 !important; }
        }
        
        /* Mobile nav - hidden on desktop */
        @media (min-width: 1025px) {
            .mobile-nav { display: none !important; }
            .mobile-header { display: none !important; }
            #app-content { padding-top: 0 !important; padding-bottom: 0 !important; }
        }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen">
    
    <!-- Desktop Sidebar Navigation -->
    <aside class="desktop-sidebar fixed left-0 top-0 h-full w-72 bg-surface-container-low z-50 flex flex-col shadow-[4px_0_24px_rgba(19,51,46,0.03)]">
        <div class="px-8 py-10 flex items-center gap-3">

            <span class="font-headline-lg text-title-md text-primary tracking-tight">BVC-KU</span>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#home" class="desktop-nav-link flex items-center px-6 py-4 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all group" data-page="home">
                <span class="material-symbols-outlined mr-4 group-hover:text-primary">home</span>
                <span class="font-label-md">Home</span>
            </a>
            <a href="#book" class="desktop-nav-link flex items-center px-6 py-4 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all group" data-page="book">
                <span class="material-symbols-outlined mr-4 group-hover:text-primary">add_task</span>
                <span class="font-label-md">Book Now</span>
            </a>
            <a href="#dashboard" class="desktop-nav-link flex items-center px-6 py-4 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all group" data-page="dashboard">
                <span class="material-symbols-outlined mr-4 group-hover:text-primary">dashboard</span>
                <span class="font-label-md">Dashboard</span>
            </a>
            <a href="#bookings" class="desktop-nav-link flex items-center px-6 py-4 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-all group" data-page="bookings">
                <span class="material-symbols-outlined mr-4 group-hover:text-primary">calendar_month</span>
                <span class="font-label-md">My Bookings</span>
            </a>
        </nav>
        <div class="px-8 py-8 border-t border-outline-variant">
            <div class="flex items-center gap-3 text-on-surface-variant">
                <span class="material-symbols-outlined text-sm">schedule</span>
                <span class="text-label-sm font-label-sm" id="desktop-clock">IST 12:00 PM</span>
            </div>
        </div>
    </aside>

    <!-- Desktop Header -->
    <header class="desktop-header fixed top-0 left-72 right-0 h-20 bg-surface/80 backdrop-blur-xl z-40 px-xl flex items-center justify-between border-b border-surface-container-high">
        <div class="flex items-center bg-surface-container px-md py-sm rounded-full">
            <span class="material-symbols-outlined text-on-surface-variant mr-sm">search</span>
            <input class="bg-transparent border-none focus:ring-0 text-label-md w-64 outline-none" placeholder="Search bookings..." type="text"/>
        </div>
        <div class="flex items-center gap-lg">
            <button class="relative p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
                <span class="material-symbols-outlined">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
            </button>
            <div class="flex items-center gap-md bg-surface-container-low px-md py-sm rounded-full hover:bg-surface-container-high cursor-pointer transition-colors">
                <img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtbAAWNyev4zSA4Ry9pfDFcXyIEIpIFDLHXtFDa6rSP8r8MkjdxCgvOveTh3MHEKgEmf58fhBi1Ce8SyrGBAg_pTe59NkRi91xYdEGEQjnZpBPUGCXXji8QCNr85gXnwhTQZkVlBr0le2041MPCs4c3k17A-xw6OEJeQeL5FugjCgOzrTeLPXRdos_goggPOUDehOxamJHVtdUDHc_LFS3gRVGZGDecmrt68rU0xmnc6kuKVhvvtWi8A"/>
                <div class="flex flex-col">
                    <span class="text-label-sm font-bold leading-none">Hem Patel</span>
                    <span class="text-[10px] text-on-surface-variant">Administrator</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Header -->
    <header class="mobile-header fixed top-0 w-full z-50 bg-primary-container text-white pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.1)]">
        <div class="h-16 px-md flex items-center justify-between">
            <div class="flex items-center gap-sm">
                <img alt="BVC-KU Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbDTqwR0f-1X-5kvk6TWl-YpLNu7551G6NLlbFVE0yJpukIiC9q10M_S5hZDSnLQiI050Vn1aNBS06cmdN7e-Y3_iBz0_LLObYR6a3UH2DK-atwOBNMw9ILqUu76PCphEI2B4BJjZe-R1Bn1Ns1TwpdHFqAFYiPO51yOv8XSDUn9SelVXF-rmDYJfnsJSu8RJUAWU9UR8C8_ddok4MkqNRb0UrYAv_miCgFd3T16PNSmkl8TYIXf6pmQ"/>
                <div class="flex flex-col">
                    <span class="font-title-md text-label-md leading-none">BVC-KU</span>
                    <span class="font-label-sm text-[10px] opacity-80 uppercase tracking-wider">Transport System</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <div class="font-label-md text-label-sm tabular-nums text-on-primary-container" id="ist-clock">00:00:00 IST</div>
                <img alt="Profile" class="w-7 h-7 rounded-full object-cover border border-white/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtbAAWNyev4zSA4Ry9pfDFcXyIEIpIFDLHXtFDa6rSP8r8MkjdxCgvOveTh3MHEKgEmf58fhBi1Ce8SyrGBAg_pTe59NkRi91xYdEGEQjnZpBPUGCXXji8QCNr85gXnwhTQZkVlBr0le2041MPCs4c3k17A-xw6OEJeQeL5FugjCgOzrTeLPXRdos_goggPOUDehOxamJHVtdUDHc_LFS3gRVGZGDecmrt68rU0xmnc6kuKVhvvtWi8A"/>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="desktop-content lg:pl-72">
        <main id="app-content" class="relative w-full pt-16 pb-24 lg:pt-20 lg:pb-8 bg-background min-h-screen">
            <!-- Content loaded dynamically -->
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav fixed bottom-0 w-full z-50 pb-safe glass shadow-[0_-1px_12px_rgba(19,51,46,0.08)] text-on-surface-variant">
        <div class="h-20 flex items-center justify-around px-sm">
            <a href="#home" class="nav-link flex flex-col items-center justify-center gap-xs px-md h-full" data-page="home">
                <span class="material-symbols-outlined">home</span>
                <span class="font-label-sm">Home</span>
            </a>
            <a href="#book" class="nav-link flex flex-col items-center justify-center gap-xs px-md h-full" data-page="book">
                <span class="material-symbols-outlined">add_circle</span>
                <span class="font-label-sm">Book</span>
            </a>
            <a href="#dashboard" class="nav-link flex flex-col items-center justify-center gap-xs px-md h-full" data-page="dashboard">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="font-label-sm">Dashboard</span>
            </a>
            <a href="#bookings" class="nav-link flex flex-col items-center justify-center gap-xs px-md h-full" data-page="bookings">
                <span class="material-symbols-outlined">format_list_bulleted</span>
                <span class="font-label-sm">Bookings</span>
            </a>
        </div>
    </nav>

    <script src="modern-app.js"></script>
</body>
</html>
